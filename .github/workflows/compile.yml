name: Build DLL

on: 
  push:
    paths:
      - '.github/workflows/compile.yml'
      - 'source/**'
      - 'premake5.lua'
  pull_request:
  workflow_dispatch:

jobs:
  build_windows:
    name: "Build DLL"
    if: 0
    uses: RaphaelIT7/gmod-common-module-base/.github/workflows/compile.yml@workflow
    with:
      PROJECT_NAME: "filesystem_stdio"
      BUILD_64x: "true"
      USE_PREFIX: "false"
      LINUX_FILEEXTENTION: "so"
      BUILD_WINDOWS: "true"
      BUILD_LINUX: "false"
      ARTIFACT_EXPIRE: "7"
      SOURCESDK_MINIMAL: "RaphaelIT7/sourcesdk-minimal"
      SOURCESDK_MINIMAL_BRANCH: "patch-7"
      SOURCESDK_MINIMAL_64XBRANCH: "x86-64-patch-3"
      GARRYSMOD_COMMON: "RaphaelIT7/garrysmod_common"
      GARRYSMOD_COMMON_BRANCH: "holylib"
      BUILD_CACHE: "true"
      UPLOAD_PDB: "true"

  build_windows_dedicated:
    name: "Build DLL (Dedicated)"
    if: false
    uses: RaphaelIT7/gmod-common-module-base/.github/workflows/compile.yml@workflow
    with:
      PROJECT_NAME: "filesystem_stdio"
      BUILD_64x: "true"
      USE_PREFIX: "false"
      LINUX_FILEEXTENTION: "so"
      BUILD_WINDOWS: "true"
      BUILD_LINUX: "false"
      ARTIFACT_EXPIRE: "7"
      SOURCESDK_MINIMAL: "RaphaelIT7/sourcesdk-minimal"
      SOURCESDK_MINIMAL_BRANCH: "patch-7"
      SOURCESDK_MINIMAL_64XBRANCH: "x86-64-patch-3"
      GARRYSMOD_COMMON: "RaphaelIT7/garrysmod_common"
      GARRYSMOD_COMMON_BRANCH: "holylib"
      BUILD_CACHE: "true"
      UPLOAD_PDB: "true"
      BUILD_WINDOWS_DEDICATED: "true"

  build_windows_64x_main:
    name: "Build DLL (64x - Main Branch)"
    if: false
    uses: RaphaelIT7/gmod-common-module-base/.github/workflows/compile.yml@workflow
    with:
      PROJECT_NAME: "filesystem_stdio"
      BUILD_64x: "true"
      BUILD_32x: "false"
      USE_PREFIX: "false"
      LINUX_FILEEXTENTION: "so"
      BUILD_WINDOWS: "true"
      BUILD_LINUX: "false"
      ADDITIONAL_POSTARTIFACTNAME: " - Main branch"
      ARTIFACT_EXPIRE: "7"
      SOURCESDK_MINIMAL: "RaphaelIT7/sourcesdk-minimal"
      SOURCESDK_MINIMAL_64XBRANCH: "patch-7"
      GARRYSMOD_COMMON: "RaphaelIT7/garrysmod_common"
      GARRYSMOD_COMMON_BRANCH: "holylib"
      BUILD_CACHE: "true"
      UPLOAD_PDB: "true"

  build_linux:
    name: "Build DLL"
    uses: RaphaelIT7/gmod-common-module-base/.github/workflows/compile.yml@workflow
    with:
      PROJECT_NAME: "filesystem_stdio"
      BUILD_64x: "false" # No 64x for now
      USE_PREFIX: "false"
      LINUX_FILEEXTENTION: "so"
      BUILD_WINDOWS: "false"
      ARTIFACT_EXPIRE: "7"
      SOURCESDK_MINIMAL: "RaphaelIT7/sourcesdk-minimal"
      SOURCESDK_MINIMAL_BRANCH: "patch-7"
      SOURCESDK_MINIMAL_64XBRANCH: "x86-64-patch-3"
      GARRYSMOD_COMMON: "RaphaelIT7/garrysmod_common"
      GARRYSMOD_COMMON_BRANCH: "holylib"
      BUILD_CACHE: "true"

  build_ghostinj:
    name: "Build GhostInj"
    if: 0
    uses: RaphaelIT7/gmod-common-module-base/.github/workflows/compile.yml@workflow
    with:
      PROJECT_PATH: "ghostinj-dll/"
      PROJECT_NAME: "ghostinj"
      BUILD_64x: "true"
      LINUX_FILEEXTENTION: "dll"
      BUILD_WINDOWS: "false"
      USE_PREFIX: "false"
      ARTIFACT_EXPIRE: "1"
      SOURCESDK_MINIMAL: "RaphaelIT7/sourcesdk-minimal"
      SOURCESDK_MINIMAL_BRANCH: "patch-7"
      SOURCESDK_MINIMAL_64XBRANCH: "x86-64-patch-3"
      GARRYSMOD_COMMON: "RaphaelIT7/garrysmod_common"
      GARRYSMOD_COMMON_BRANCH: "holylib"
      BUILD_CACHE: "true"